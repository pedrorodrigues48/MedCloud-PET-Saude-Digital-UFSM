name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Testes, qualidade e segurança (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -q
      - name: Vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r portal-laboratorio/requirements.txt

  javascript:
    name: Sintaxe do portal (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe
        run: |
          for arquivo in portal-laboratorio/*.js; do
            node --check "$arquivo"
          done

  segredos:
    name: Procurar segredos vazados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
