name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Qualidade e segurança (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ferramentas
        run: pip install ruff pip-audit
      - name: Lint (ruff)
        run: ruff check .
      - name: Vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r portal-laboratorio/requirements.txt
      - name: Testes (pytest)
        run: |
          if [ -d tests ]; then
            pip install -r portal-laboratorio/requirements.txt pytest httpx
            pytest -q
          else
            echo "Ainda não há testes (pasta tests/)."
          fi

  segredos:
    name: Procurar segredos vazados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
